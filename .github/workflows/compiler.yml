name: Compile and Publish Public Downloads

on:
  push:
    branches: [ "main" ] # Triggers instantly on normal pushes

permissions:
  contents: write # Grants the runner explicit permission to publish files

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: calcrust.exe
            asset_name: calcrust-windows.exe
          - os: ubuntu-latest
            artifact_name: calcrust
            asset_name: calcrust-linux
          - os: macos-latest
            artifact_name: calcrust
            asset_name: calcrust-macos

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Compile Release Binary
      run: cargo build --release --verbose

    - name: Prepare Executable
      run: |
        cd target/release
        mv ${{ matrix.artifact_name }} ${{ matrix.asset_name }}
      shell: bash

    - name: Upload to Public Release Page
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Compiled Builds
        draft: false
        prerelease: false
        files: target/release/${{ matrix.asset_name }}
