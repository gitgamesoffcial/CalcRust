name: Compile and Publish Public Releases

on:
  push:
    tags:
      - 'v*' # Triggers the build automatically whenever you push a tag like v1.0.0

jobs:
  build:
    name: Build Binary for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: calcrust.exe
            asset_name: calcrust-windows.exe
          - os: ubuntu-latest
            artifact_name: calcrust
            asset_name: calcrust-linux
          - os: macos-latest
            artifact_name: calcrust
            asset_name: calcrust-macos

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Compile Release Binary
      run: cargo build --release --verbose

    - name: Rename executable for clarity
      run: |
        cd target/release
        mv ${{ matrix.artifact_name }} ${{ matrix.asset_name }}
      shell: bash

    - name: Upload to Public Release
      uses: softprops/action-gh-release@v2
      with:
        files: target/release/${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
